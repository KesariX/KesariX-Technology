    <!--
      Font strategy:
      1. preconnect opens the TCP connection to Google Fonts before CSS is parsed
      2. <link rel="stylesheet"> is non-render-blocking (unlike @import in CSS)
      3. display=swap keeps text visible during font download (prevents invisible text)
      Weights trimmed: removed 300 (unused), kept 400/500/600/700 for Space Grotesk
      and 400/500 for JetBrains Mono to cut ~40 KB from font payload.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" as="style" />

      media="print"

    />
